[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-to-production-intelligence-system"
version = "0.1.0"
description = "AI-driven platform delivery governance MVP: requirement extraction, ownership routing, dependency intelligence, issue triage, and production readiness assessment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tony Lee" }]
dependencies = [
    "pydantic>=2.7,<3",
    "networkx>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "markdown>=3.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10",
    "types-networkx",
]

[tool.setuptools]
packages = ["app", "app.agents", "app.schemas", "app.services"]

[tool.mypy]
python_version = "3.11"
# Progressive strictness: every function must be annotated
# (disallow_untyped_defs) and functions must not silently return Any.
# Scope: `mypy app` (see CI). Tests are not type-checked yet.
# networkx is covered by the types-networkx stubs (dev dependency).
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ensure repo root is importable so bare `pytest` works, not only
# `python -m pytest` (which adds CWD to sys.path implicitly).
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# app/main.py bootstraps sys.path before importing app.* so that both
# `python -m app.main` and `python app/main.py` work; E402 is intentional there.
"app/main.py" = ["E402"]
